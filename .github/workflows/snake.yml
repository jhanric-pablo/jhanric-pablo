name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 08:00 Manila time
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff0000&color_dots=#ebedf0,#ffc9c9,#ff8080,#ff3b3b,#cc0000
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff0000&color_dots=#161b22,#4d0000,#800000,#b30000,#ff0000

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
